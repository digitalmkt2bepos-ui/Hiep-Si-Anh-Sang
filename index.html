:root{--bg:#CFE6FB;--blue:#1E6FE0;--sky:#5BB6FF;--ink:#0F3B7A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A2E}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'Be Vietnam Pro',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;color:var(--ink)}
#game{position:relative;height:min(100%,100vw*1.6);aspect-ratio:5/8;max-width:100%;border-radius:1.2em;overflow:hidden;box-shadow:0 1em 3em rgba(30,111,224,.35);user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
.pill{background:rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.85);border-radius:1.2em;box-shadow:0 .4em 1.2em rgba(30,111,224,.2)}
#hud{position:absolute;top:.8em;left:.8em;right:.8em;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#sc{padding:.35em 1em .3em;line-height:1}
#sc small{display:block;font-size:.55em;letter-spacing:.18em;color:#4B7FC4;font-weight:600}
#score{font:800 2em/1 'Baloo 2',sans-serif;color:var(--blue);display:inline-block}
#hearts{padding:.45em .8em;font-size:1.25em;line-height:1;letter-spacing:.1em}
#hearts i{font-style:normal;color:#B9CCE3}#hearts i.on{color:#FF5C7C;text-shadow:0 0 .6em rgba(255,92,124,.5)}
#pause{position:absolute;top:.8em;left:50%;margin-left:-1.15em;width:2.3em;height:2.3em;border-radius:50%;cursor:pointer;color:var(--blue);font-size:1em;padding:0}
#combo{position:absolute;top:4.6em;left:50%;transform:translateX(-50%) scale(.6);opacity:0;font:800 1.15em 'Baloo 2';color:#fff;background:linear-gradient(135deg,#5BB6FF,#1E6FE0);padding:.1em .9em;border-radius:99em;transition:.25s;pointer-events:none;box-shadow:0 .3em 1em rgba(30,111,224,.4)}
#combo.show{opacity:1;transform:translateX(-50%) scale(1)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 45%,rgba(255,110,60,.7))}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.2em 1.2em 2.2em;gap:.45em;background:linear-gradient(180deg,rgba(235,246,255,.55),rgba(150,205,252,.35));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .45s ease both}
#over,#paused{background:rgba(215,236,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hide{display:none!important}
.in{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(1.4em) scale(.95)}}
@keyframes float{50%{transform:translateY(-.6em) rotate(1.5deg)}}
@keyframes pulse{50%{box-shadow:0 .5em 2.2em rgba(30,111,224,.8),inset 0 .15em .2em rgba(255,255,255,.5);transform:scale(1.04)}}
@keyframes shine{to{left:130%}}
.logo{font:800 1.5em 'Be Vietnam Pro';color:var(--blue);letter-spacing:-.02em}
.tape{font:italic 500 1.02em/1.2 'PP-Noto','Noto Serif Display',Georgia,serif;color:#1E6FE0;background:rgba(255,255,255,.8);padding:.35em 1em;transform:rotate(-3deg);box-shadow:0 .2em .6em rgba(30,111,224,.2);clip-path:polygon(0 8%,3% 0,97% 6%,100% 0,100% 94%,97% 100%,3% 92%,0 100%)}
.ttl{font:2.3em/1.2 'PP-Pacifico',Pacifico,Lobster,cursive;white-space:nowrap;letter-spacing:-.02em;margin:.15em 0 0;transform:rotate(-3deg);background:linear-gradient(180deg,#6CC8FF 0%,#2F86F0 55%,#1556C8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(.035em 0 0 #fff) drop-shadow(-.035em 0 0 #fff) drop-shadow(0 .035em 0 #fff) drop-shadow(0 -.035em 0 #fff) drop-shadow(0 .1em .12em rgba(20,80,190,.4))}
.row1{display:flex;align-items:center;justify-content:center;gap:.6em;margin-top:.2em}
.cas{font:1.75em/1.2 'PP-Pacifico',Pacifico,Lobster,cursive;transform:rotate(-3deg);white-space:nowrap;display:flex;align-items:flex-start;gap:.1em;background:linear-gradient(180deg,#6CC8FF 0%,#2F86F0 55%,#1556C8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(.035em 0 0 #fff) drop-shadow(-.035em 0 0 #fff) drop-shadow(0 .035em 0 #fff) drop-shadow(0 -.035em 0 #fff) drop-shadow(0 .1em .12em rgba(20,80,190,.4))}
.cas svg{width:.55em;height:.55em;-webkit-text-fill-color:initial}
.sub svg{position:absolute;left:50%;top:50%;width:13em;height:2em;transform:translate(-50%,-30%);z-index:-1}
.sub{position:relative;isolation:isolate;font:1.3em/1.4 'PP-Pacifico',Pacifico,cursive;margin-top:-.1em;transform:rotate(-3deg);color:#1E6FE0;filter:drop-shadow(.03em 0 0 #fff) drop-shadow(-.03em 0 0 #fff) drop-shadow(0 .03em 0 #fff) drop-shadow(0 -.03em 0 #fff)}
.hw{position:relative;flex:1 1 0;width:100%;min-height:4em;display:flex;justify-content:center;margin:.2em 0}
.hw::before{content:'';position:absolute;left:50%;top:0;height:100%;aspect-ratio:1;transform:translateX(-50%) scale(1.25);border-radius:50%;background:radial-gradient(rgba(255,255,255,.95),rgba(255,255,255,0) 68%)}
.hw img{position:relative;height:100%;width:auto;max-width:100%;object-fit:contain;display:block;animation:float 3.6s ease-in-out infinite;filter:drop-shadow(0 .5em .7em rgba(30,111,224,.35))}
.chips{display:flex;gap:.4em;justify-content:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:.35em;font:600 .72em 'Be Vietnam Pro';padding:.3em .8em .3em .5em;color:var(--ink)}
.chip img,.chip svg{height:2em;width:auto}
.btn{position:relative;overflow:hidden;border:0;border-radius:99em;padding:.7em 2.4em;font:800 1.2em 'Baloo 2',sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,#5BB6FF,#1E6FE0);box-shadow:0 .5em 1.4em rgba(30,111,224,.45),inset 0 .15em .2em rgba(255,255,255,.5);transition:transform .15s}
.btn:active{transform:scale(.94)}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 2.8s infinite}
.btn.main{animation:pulse 2s ease-in-out infinite}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--blue);box-shadow:inset 0 0 0 .1em #8CC6FF;font-size:1em;padding:.55em 1.8em}
.btn.ghost::after{display:none}
.btn:focus-visible,#pause:focus-visible{outline:.2em solid #0F3B7A;outline-offset:.15em}
.best{font:700 .95em 'Baloo 2';color:#3A78C4}
.hint{font-size:.68em;color:#4B7FC4;max-width:24em;line-height:1.5;margin:0}
.big{font:800 5em/1 'Baloo 2';color:var(--blue);-webkit-text-stroke:.07em #fff;paint-order:stroke fill;filter:drop-shadow(0 .08em .1em rgba(20,80,190,.35))}
.h2{font:2.6em/1 Lobster;color:var(--blue);-webkit-text-stroke:.12em #fff;paint-order:stroke fill;filter:drop-shadow(0 .1em .1em rgba(20,80,190,.35));transform:rotate(-3deg);margin:0}
.msg{font:700 1.35em 'Dancing Script';color:var(--blue);margin:0}
.badge{font:800 .8em 'Baloo 2';color:#fff;background:linear-gradient(135deg,#FF9A3D,#FF5C7C);padding:0 .9em;border-radius:99em;animation:pulse 1.4s infinite}
.scr>*{flex-shrink:0}.scr>.hw{flex-shrink:1}
.inmenu #hud,.inmenu #pause,.inmenu #combo{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
.hint,.chip,.best{font-family:'PP-Work','Work Sans','Be Vietnam Pro',sans-serif;font-style:italic}
.titlebox{width:100%;display:flex;justify-content:center}.titlebox img{width:96%;max-width:25em;display:block;animation:sway 5s ease-in-out infinite;filter:drop-shadow(0 .25em .4em rgba(30,111,224,.22))}
@keyframes sway{50%{transform:translateY(-.3em) rotate(-.5deg)}}
#mute{position:absolute;z-index:5;top:.8em;left:calc(50% + 1.45em);width:2.3em;height:2.3em;border-radius:50%;cursor:pointer;font-size:1em;padding:0;line-height:1}
.inmenu #mute{left:auto;right:.8em}
#mute:focus-visible{outline:.2em solid #0F3B7A;outline-offset:.15em}
</style></head><body>

var AC=null,master,musGain,sfxGain,nb,muted=false,timer=null,step=0,nextT=0,musLv=.32;

function audio(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
AC=new C();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
musGain=AC.createGain();musGain.gain.value=musLv;musGain.connect(master);sfxGain=AC.createGain();sfxGain.gain.value=.9;sfxGain.connect(master);
nb=AC.createBuffer(1,AC.sampleRate>>1,AC.sampleRate);var d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
if(AC.state==='suspended')AC.resume();return AC}
function N(m){return 440*Math.pow(2,(m-69)/12)}
function tone(f,t0,dur,type,vol,dest,f2){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.05)}
function noise(t0,dur,vol,dest,hp){var s=AC.createBufferSource();s.buffer=nb;var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;var g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t0);s.stop(t0+dur)}
function sfx(k,n){if(muted||!audio())return;var t=AC.currentTime+.005,d=sfxGain,seq=function(a,gap,ty,v,len){a.forEach(function(m,i){tone(N(m),t+i*gap,len,ty,v,d)})};
if(k==='catch'){var f=N(76+Math.min(n||0,8)*2);tone(f,t,.22,'triangle',.35,d);tone(f*2,t,.15,'sine',.14,d)}
else if(k==='bonus')seq([84,88,91,96],.055,'sine',.28,.25);
else if(k==='combo')seq([88,95],.08,'triangle',.25,.3);
else if(k==='hit'){tone(210,t,.35,'sawtooth',.3,d,60);noise(t,.2,.25,d,800)}
else if(k==='miss')tone(320,t,.28,'sine',.38,d,90);
else if(k==='over')seq([67,64,60,55],.14,'triangle',.3,.35);
else if(k==='start')seq([72,76,79,84],.06,'sine',.3,.25);
else if(k==='ui')tone(660,t,.1,'triangle',.22,d,990)}
var CH=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]],RT=[48,43,45,41],SP=60/112/4;
function sched(){if(!AC)return;while(nextT<AC.currentTime+.25){var s=step%64,bar=s>>4,x=s&15,c=CH[bar],t=nextT,d=musGain;
if(x%4===0)tone(130,t,.16,'sine',.55,d,45);
if(x%4===2)noise(t,.035,.1,d,7500);
if(x===4||x===12)noise(t,.09,.1,d,2200);
if(x%4===0||x===6||x===14)tone(N(RT[bar]),t,.2,'triangle',.32,d);
if(x%2===0)tone(N(c[(x>>1)%3]+12),t,.22,'triangle',.13,d);
if(x===0)tone(N(c[2]+24),t,.7,'sine',.07,d);
if(x===8||x===14)tone(N(c[1]+24),t,.25,'sine',.08,d);
nextT+=SP;step++}}

game.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.btn,#pause,#mute');if(b&&b.id!=='start'&&b.id!=='again')sfx('ui')});

function burst(x,y,cols,n){for(var i=0;i<n;i++){var a=Math.random()*6.28,s=60+Math.random()*140;ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:1,r:2+Math.random()*4,c:cols[i%cols.length]})}}
function spawn(){var r=Math.random(),pb=Math.min(.18+t*.002,.35),ty=r<pb?2:(r<pb+.14?1:0);
items.push({x:24+Math.random()*(W-48),y:-90,ty:ty,v:(130+Math.min(t*3.2,220))*(.9+Math.random()*.3),rot:Math.random()*6,vr:(Math.random()-.5)*2.4})}

function fxu(dt){
fx.forEach(function(f){f.y-=48*dt;f.l-=dt*1.2});fx=fx.filter(function(f){return f.l>0});
ps.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.l-=dt*1.6});ps=ps.filter(function(p){return p.l>0});
if(shake>0)shake-=dt;pl.sq*=Math.pow(.001,dt)}
function update(dt){
t+=dt;
var k=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);
if(k)pl.tx+=k*420*dt;
pl.tx=Math.max(PW/2,Math.min(W-PW/2,pl.tx));
var tg=Math.max(-.2,Math.min(.2,(pl.tx-pl.x)*.012));
pl.x+=(pl.tx-pl.x)*Math.min(1,dt*16);pl.tilt+=(tg-pl.tilt)*Math.min(1,dt*12);
spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.42,1-t*.007)*(.8+Math.random()*.5)}
for(var i=items.length-1;i>=0;i--){var it=items[i];it.y+=it.v*dt;it.rot+=it.vr*dt;
var bad=it.ty===2,cy=it.y+(bad?20:TH/2);
if(cy>PY+6&&cy<PY+56&&Math.abs(it.x-pl.x)<PW/2-4){
 if(bad){sfx('hit');lose(it.x,PY);fx.push({x:it.x,y:PY,s:'−1 ♥',c:'#FF5C7C',l:1})}
 else{combo++;sfx(it.ty?'bonus':'catch',combo);if(combo%5===0)setTimeout(function(){sfx('combo')},120);var m=1+Math.floor(combo/5),p=(it.ty?25:10)*m;score+=p;pl.sq=1;burst(it.x,PY+10,['#fff','#7CCBFF','#3A9BF0'],10);
  fx.push({x:it.x,y:PY,s:'+'+p,c:'#1E6FE0',l:1});hud();
  $('score').animate([{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:240,easing:'ease-out'});
  if(combo>=3)$('combo').animate([{transform:'translateX(-50%) scale(1.3)'},{transform:'translateX(-50%) scale(1)'}],{duration:240})}
 items.splice(i,1);continue}
if(it.y>H-20){if(!bad){sfx('miss');lose(it.x,H-40);fx.push({x:it.x,y:H-44,s:'Trượt!',c:'#FF5C7C',l:1})}items.splice(i,1)}}
}

function star(x,y,r){ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fill()}
var BI=new Image();BI.src=I5;
function bg(dt){
var k=1.03+.025*Math.sin(T*.25),ih=H*k,iw=ih*.75,ox=-(iw-W)*(.18+.1*Math.sin(T*.18)),oy=-(ih-H)*(.92+.08*Math.sin(T*.22)),sx=iw/1200;
if(BI.complete&&BI.naturalWidth)ctx.drawImage(BI,ox,oy,iw,ih);else{var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#E9F5FF');g.addColorStop(1,'#6FB2F0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
for(var i=0;i<3;i++){var bx=((T*16+i*190)%(W+360))-180;ctx.save();ctx.translate(bx,-30);ctx.rotate(-.35);var b=ctx.createLinearGradient(-70,0,70,0);b.addColorStop(0,'rgba(255,255,255,0)');b.addColorStop(.5,'rgba(255,255,255,.26)');b.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=b;ctx.fillRect(-70,0,140,820);ctx.restore()}
ctx.lineWidth=1;for(i=0;i<9;i++){var y=H*.6+i*17;ctx.strokeStyle='rgba(255,255,255,'+(.12+.2*(.5+.5*Math.sin(T*1.4+i*1.7)))+')';ctx.beginPath();for(var x=0;x<=W;x+=10){var yy=y+Math.sin(x*.03+T*1.2+i)*2.5;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke()}
ctx.save();ctx.translate(ox+320*sx,oy+1425*sx);ctx.rotate(-.16);ctx.beginPath();ctx.ellipse(0,0,265*sx,100*sx,0,0,7);ctx.clip();
var p=((T*.3)%1)*2-1,gx=p*320*sx,vg=ctx.createLinearGradient(gx-60*sx,0,gx+60*sx,0);vg.addColorStop(0,'rgba(255,255,255,0)');vg.addColorStop(.5,'rgba(255,255,255,.5)');vg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=vg;ctx.fillRect(gx-60*sx,-120*sx,120*sx,240*sx);ctx.restore();
stars.forEach(function(s){ctx.fillStyle='rgba(255,255,255,'+(.4+.5*Math.sin(T*2+s.ph))+')';star(s.x,s.y,s.r*(.7+.3*Math.sin(T*2+s.ph)))});
ctx.font='28px Georgia,serif';ctx.textAlign='center';ctx.shadowColor='#fff';ctx.shadowBlur=10;
notes.forEach(function(n){n.y-=n.v*dt;if(n.y<-30)n.y=H+30;ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText(n.c,n.x+Math.sin(T+n.ph)*14,n.y)});ctx.shadowBlur=0;
bub.forEach(function(b){b.y-=b.v*dt;if(b.y<-30){b.y=H+30;b.x=Math.random()*W}var x=b.x+Math.sin(T+b.ph)*8;
var rg=ctx.createRadialGradient(x-b.r*.35,b.y-b.r*.35,b.r*.1,x,b.y,b.r);rg.addColorStop(0,'rgba(255,255,255,.9)');rg.addColorStop(.6,'rgba(200,230,255,.18)');rg.addColorStop(1,'rgba(120,185,255,.3)');
ctx.fillStyle=rg;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,b.y,b.r,0,7);ctx.fill();ctx.stroke()})}
function sun(x,y,r){ctx.save();ctx.translate(x,y);var p=1+.06*Math.sin(T*6);
var gl=ctx.createRadialGradient(0,0,0,0,0,r*1.6);gl.addColorStop(0,'rgba(255,170,60,.55)');gl.addColorStop(1,'rgba(255,170,60,0)');ctx.fillStyle=gl;ctx.fillRect(-r*2,-r*2,r*4,r*4);
ctx.strokeStyle='#FF7A30';ctx.lineWidth=3;ctx.lineCap='round';
for(var i=0;i<12;i++){var a=i*Math.PI/6+T*.9;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.75*p,Math.sin(a)*r*.75*p);ctx.lineTo(Math.cos(a)*r*1.1*p,Math.sin(a)*r*1.1*p);ctx.stroke()}
var g=ctx.createRadialGradient(-3,-3,2,0,0,r*.65);g.addColorStop(0,'#FFE29A');g.addColorStop(1,'#FF7A30');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*.62,0,7);ctx.fill();
ctx.fillStyle='#fff';ctx.font='800 13px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.fillText('UV',0,5);ctx.restore()}
function draw(dt){
ctx.clearRect(0,0,W,H);ctx.save();
if(shake>0)ctx.translate((Math.random()-.5)*7,(Math.random()-.5)*7);
bg(dt);
if(st!=='menu'){
 items.forEach(function(it){if(it.ty===2){sun(it.x,it.y+20,26);return}ctx.save();ctx.translate(it.x,it.y+TH/2);ctx.rotate(Math.sin(it.rot)*.35);if(it.ty===1){ctx.shadowColor='#7CCBFF';ctx.shadowBlur=14;ctx.drawImage(mI,-26/2,-TH/2,26,TH)}else ctx.drawImage(tI,-TW/2,-TH/2,TW,TH);ctx.restore()});
 ctx.save();ctx.translate(pl.x,H-14);ctx.rotate(pl.tilt);var s=pl.sq,bob=Math.sin(T*3)*.012;ctx.scale(1+s*.1,1-s*.08+bob);ctx.drawImage(pI,-PW/2,-PH,PW,PH);ctx.restore()}
// water floor
var y0=H-24;ctx.beginPath();ctx.moveTo(0,H);for(var x=0;x<=W;x+=8)ctx.lineTo(x,y0+Math.sin(x*.035+T*2.2)*3);ctx.lineTo(W,H);ctx.closePath();
var fg=ctx.createLinearGradient(0,y0,0,H);fg.addColorStop(0,'rgba(255,255,255,.8)');fg.addColorStop(1,'rgba(143,203,255,.95)');ctx.fillStyle=fg;ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.beginPath();for(x=0;x<=W;x+=8){var yy=y0-2+Math.sin(x*.035+T*2.2+1)*3;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke();
ps.forEach(function(p){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;star(p.x,p.y,p.r*1.6)});ctx.globalAlpha=1;
ctx.font='800 24px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=6;
fx.forEach(function(f){ctx.globalAlpha=Math.max(0,f.l);ctx.strokeStyle='#fff';ctx.strokeText(f.s,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y)});ctx.globalAlpha=1;
ctx.restore()}

reset();
var last=0;
function loop(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(st!=='pause')T+=dt;
if(st==='play')update(dt);if(st==='play'||st==='over')fxu(dt);
draw(st==='pause'?0:dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function setX(cx){var r=game.getBoundingClientRect();pl.tx=(cx-r.left)/r.width*W}
game.addEventListener('pointerdown',function(e){if(st==='play'&&e.target===cv)setX(e.clientX)});
game.addEventListener('pointermove',function(e){if(st==='play')setX(e.clientX)});
window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key==='Escape'||e.key==='p')(st==='play'?pause:resume)();if((e.key==='Enter'||e.key===' ')&&st==='menu')start();if(['ArrowLeft','ArrowRight',' '].indexOf(e.key)>-1&&st==='play')e.preventDefault()});
window.addEventListener('keyup',function(e){keys[e.key]=false});
document.addEventListener('visibilitychange',function(){if(document.hidden){pause();if(AC)AC.suspend()}else if(AC)AC.resume()});
})();
</script></body></html>
