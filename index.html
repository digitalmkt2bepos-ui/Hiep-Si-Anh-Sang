<style>
:root{--bg:#FBEDE2;--ink:#2B2522;--card:#fff;--peach:#F6CFA4;--orange:#E8814A;--red:#C9412F;--muted:#8A7B72;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1714;--ink:#FFF4EC}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#game{position:relative;height:min(100%,100vw*1.6);aspect-ratio:5/8;max-width:100%;background:linear-gradient(180deg,#fff 0%,#FFF6EE 55%,#F9DDC3 100%);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(201,65,47,.18)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.serif{font-family:Marcellus,Georgia,serif}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;pointer-events:none;color:#2B2522}
#hud .sc{font-size:34px;line-height:1}
#hud small{display:block;font-size:12px;color:#8A7B72;margin-top:4px}
#hearts{font-size:20px;letter-spacing:2px;color:#C9412F;text-align:right}
#combo{position:absolute;top:70px;left:16px;font-size:14px;color:#E8814A;font-weight:500;pointer-events:none}
#pause{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;border:1.5px solid #E8814A;background:#fff;color:#C9412F;font-size:14px;cursor:pointer}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:rgba(255,248,242,.94);color:#2B2522;gap:10px}
.scr.hide{display:none}
.bar{width:64px;height:6px;border-radius:3px;background:linear-gradient(90deg,#F6CFA4,#E8814A,#C9412F)}
.brand{font-size:15px;letter-spacing:.32em}
h1{font-weight:400;font-size:34px;line-height:1.1;margin:6px 0 0}
p{margin:0;color:#6B5C54;font-size:15px;line-height:1.5;max-width:300px}
.btn{margin-top:10px;border:0;border-radius:999px;padding:14px 38px;font:500 17px Jost,sans-serif;color:#fff;background:linear-gradient(135deg,#E8814A,#C9412F);cursor:pointer}
.btn.ghost{background:none;color:#C9412F;border:1.5px solid #E8814A;margin-top:0;padding:11px 30px;font-size:15px}
.btn:focus-visible,#pause:focus-visible{outline:3px solid #2B2522;outline-offset:2px}
.legend{display:flex;gap:18px;justify-content:center;margin:6px 0;font-size:13px;color:#6B5C54}
.legend span{display:flex;align-items:center;gap:6px}
.legend img{height:34px}
.big{font-size:64px;line-height:1}
</style></head><body>

var $=function(i){return document.getElementById(i)};
var best=0;try{best=+localStorage.getItem('pepti_best')||0}catch(e){}
function setBest(){$('best').textContent='Kỷ lục '+best}
setBest();
function fit(){var r=game.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
window.addEventListener('resize',fit);fit();

var PW=110,PH=158,TW=28,TH=86;
var st='menu',score,lives,combo,x,tx,items,fx,spawnT,t,keys={},rays=[];
for(var i=0;i<6;i++)rays.push({x:Math.random()*W,y:Math.random()*H,r:30+Math.random()*50});

function reset(){score=0;lives=3;combo=0;x=tx=W/2;items=[];fx=[];spawnT=0.6;t=0;hud()}
function hud(){$('score').textContent=score;var h='';for(var i=0;i<3;i++)h+=i<lives?'♥':'♡';$('hearts').textContent=h;$('combo').textContent=combo>=3?'Combo ×'+(1+Math.floor(combo/5)):''}
function show(id){['menu','over','paused'].forEach(function(k){$(k).classList.toggle('hide',k!==id)})}
function start(){reset();st='play';show('');}
function end(){st='over';if(score>best){best=score;try{localStorage.setItem('pepti_best',best)}catch(e){}}setBest();
$('fscore').textContent=score;$('fmsg').textContent=score>=best&&score>0?'Kỷ lục mới! Da khỏe, điểm cao.':(score>=200?'Chống nắng chuẩn rồi đó!':'Thoa lại kem và thử tiếp nhé.');show('over')}
function lose(){lives--;combo=0;hud();if(lives<=0)end()}
function pause(){if(st==='play'){st='pause';show('paused')}}
function resume(){if(st==='pause'){st='play';show('')}}
$('start').onclick=$('again').onclick=start;
$('tomenu').onclick=$('quit').onclick=function(){st='menu';show('menu')};
$('pause').onclick=pause;$('resume').onclick=resume;

function spawn(){var bad=Math.random()<Math.min(0.18+t*0.002,0.35);
items.push({x:24+Math.random()*(W-48),y:-90,bad:bad,v:(130+Math.min(t*3.2,220))*(0.9+Math.random()*0.3),rot:0,vr:(Math.random()-.5)*2})}

function update(dt){
t+=dt;
var k=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);
if(k)tx+=k*420*dt;
tx=Math.max(PW/2,Math.min(W-PW/2,tx));x+=(tx-x)*Math.min(1,dt*18);
spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(0.42,1.0-t*0.007)*(0.8+Math.random()*0.5)}
var py=H-PH-18;
for(var i=items.length-1;i>=0;i--){var it=items[i];it.y+=it.v*dt;it.rot+=it.vr*dt;
var ih=it.bad?40:TH,cy=it.y+ih/2;
if(cy>py+8&&cy<py+70&&Math.abs(it.x-x)<PW/2-6){
 if(it.bad){lose();fx.push({x:it.x,y:py,s:'−1 ♥',c:'#C9412F',l:1});shake=0.25}
 else{combo++;var m=1+Math.floor(combo/5);score+=10*m;fx.push({x:it.x,y:py,s:'+'+10*m,c:'#E8814A',l:1});hud()}
 items.splice(i,1);continue}
if(it.y>H){if(!it.bad){lose();fx.push({x:it.x,y:H-30,s:'Trượt!',c:'#C9412F',l:1})}items.splice(i,1)}}
fx.forEach(function(f){f.y-=40*dt;f.l-=dt*1.3});fx=fx.filter(function(f){return f.l>0});
if(shake>0)shake-=dt;
}
var shake=0;
function sun(x,y,r){ctx.save();ctx.translate(x,y);ctx.strokeStyle='#C9412F';ctx.lineWidth=3;ctx.lineCap='round';
for(var i=0;i<12;i++){var a=i*Math.PI/6+t*0.8;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*0.75,Math.sin(a)*r*0.75);ctx.lineTo(Math.cos(a)*r*1.1,Math.sin(a)*r*1.1);ctx.stroke()}
var g=ctx.createRadialGradient(0,0,2,0,0,r*0.6);g.addColorStop(0,'#F6CFA4');g.addColorStop(1,'#E8814A');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*0.6,0,7);ctx.fill();
ctx.fillStyle='#fff';ctx.font='600 13px Jost,sans-serif';ctx.textAlign='center';ctx.fillText('UV',0,5);ctx.restore()}
